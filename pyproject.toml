[project]
name = "todo-project"
version = "0.1.0"
description = "Secured To-Do service with Django Rest Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django",
    "djangorestframework",
    "psycopg2-binary",
    "python-dotenv",
    "django-cors-headers",
    "djangorestframework-simplejwt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["app"]
